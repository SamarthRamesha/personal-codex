name: Verify Personal Codex
on:
  push:
    branches: [main, personal-codex/stabilization, personal-codex/mac-automation, personal-codex/codex-integration, personal-codex/freebuff-implementation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Optional recovery dependency
        # The recovery tier and the disaster-recovery drill skip without this wheel. CI installs it
        # so those paths run here instead of reporting a skip as a pass.
        # Quoted: an unquoted ':all:' followed by a space is valid pip but invalid YAML here.
        run: "python -m pip install --only-binary=:all: cryptography"
      - name: Isolated backend and HTTP regression
        env:
          PERSONAL_CODEX_HTTP_TESTS: '1'
          PERSONAL_CODEX_DATA: ${{ runner.temp }}/personal-codex-tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic disaster-recovery drill
        run: python scripts/recovery_drill.py --evidence "$RUNNER_TEMP/recovery-drill.json" --scratch-parent "$RUNNER_TEMP"
      - name: Synthetic document retrieval evaluation
        run: python scripts/document_search_acceptance.py --output "$RUNNER_TEMP/document-retrieval.json"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare embedded frontend
        working-directory: desktop
        run: npm ci --ignore-scripts && npm run build
      - name: Build and test Mac automation helper
        run: python3 scripts/build_mac_automation.py --self-test
      - name: Native policy and one-use action tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml -j 2
      - name: Disposable calculator task with scripted inference
        run: python3 scripts/full_task_acceptance.py --output "$RUNNER_TEMP/personal-codex-calculator"
      - name: Stop and resume a disposable task within its original scope
        run: python3 scripts/full_task_acceptance.py --cancel --output "$RUNNER_TEMP/personal-codex-cancel-resume"
      - name: Build and verify the native application bundle
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          npm run tauri -- build --ci --bundles app -- --locked
          app="src-tauri/target/release/bundle/macos/Personal Codex.app"
          test -x "$app/Contents/MacOS/personal-codex"
          test -x "$app/Contents/Resources/automation/Personal Codex Automation.app/Contents/MacOS/personal-codex-automation"
          codesign --verify --deep --strict "$app"
      - name: Archive the integration candidate
        if: github.ref == 'refs/heads/personal-codex/codex-integration'
        working-directory: desktop
        run: |
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Personal Codex.app" "$RUNNER_TEMP/Personal-Codex-macOS.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 Personal-Codex-macOS.zip > Personal-Codex-macOS.sha256
          shasum -a 256 -c Personal-Codex-macOS.sha256
      - name: Upload the integration candidate and synthetic task evidence
        if: github.ref == 'refs/heads/personal-codex/codex-integration'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Personal-Codex-macOS-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Personal-Codex-macOS.zip
            ${{ runner.temp }}/Personal-Codex-macOS.sha256
            ${{ runner.temp }}/personal-codex-calculator/evidence.json
            ${{ runner.temp }}/personal-codex-cancel-resume/evidence.json
          if-no-files-found: error
          retention-days: 14
