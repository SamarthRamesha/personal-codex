<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Codex · ML workflow benchmark</title>
<style>body{font:16px system-ui;background:#101720;color:#e2edf5;max-width:1050px;margin:50px auto;padding:0 24px}header{border-bottom:1px solid #526070;padding-bottom:20px}h1{font-size:34px}button{background:#b8eb9a;color:#142116;border:0;border-radius:8px;padding:12px;cursor:pointer}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{background:#1d2938;border-radius:12px;padding:20px;min-width:160px}th,td{text-align:left;padding:12px;border-bottom:1px solid #526070}table{border-collapse:collapse;width:100%}small,p{color:#bbcbd8}.error{color:#ffb1aa}</style>
<header><p>PERSONAL CODEX / SYNTHETIC ACCEPTANCE FIXTURE</p><h1>Model comparison &amp; audit</h1><p>Reproducible tabular classification. No personal data or external service.</p><button id="refresh">Reload saved report</button></header><p id="status" role="status">Loading local artifacts…</p><main id="report"></main>
<script>
const format=n=>typeof n==='number'?n.toFixed(3):'Unavailable';
async function load(){const status=document.getElementById('status'),main=document.getElementById('report');try{const response=await fetch('artifacts/report.json',{cache:'no-store'});if(!response.ok)throw Error('Generate artifacts with the documented training command first.');const r=await response.json();main.replaceChildren();const heading=document.createElement('h2');heading.textContent=`Selected: ${r.selected} · seed ${r.seed} · ${r.rows} rows`;main.append(heading);const cards=document.createElement('div');cards.className='cards';for(const [name,value]of Object.entries(r.test)){const c=document.createElement('div');c.className='card';const label=document.createElement('p'),number=document.createElement('strong');label.textContent=name;number.textContent=format(value);c.append(label,number);cards.append(c)}main.append(cards);const table=document.createElement('table');const header=table.insertRow();for(const name of ['Candidate','Cross-validation AP','Validation AP']){const c=document.createElement('th');c.textContent=name;header.append(c)}for(const[name,candidate]of Object.entries(r.comparison)){const row=table.insertRow();for(const value of [name,format(candidate.cv_average_precision),format(candidate.validation.average_precision)])row.insertCell().textContent=value}main.append(table);for(const [title,value]of [['Fairness audit',r.fairness],['Explainability',r.explainability],['Drift',r.drift],['Limitations',r.limits]]){const h=document.createElement('h2'),pre=document.createElement('pre');h.textContent=title;pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(value,null,2);main.append(h,pre)}status.className='';status.textContent=`Saved report loaded. ${r.splits.train.length} training / ${r.splits.validation.length} validation / ${r.splits.test.length} held-out test rows.`}catch(error){status.className='error';status.textContent=error.message}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></html>
